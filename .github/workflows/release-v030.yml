name: Release v0.3.0

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release-v030.yml' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: a6bda068459a5411ff986cbc8e7de52914c50938
      - name: Validate release source
        shell: powershell
        run: |
          .\tests\Encoding.Tests.ps1
          .\tests\Static.Tests.ps1
          .\tests\Audit.Tests.ps1
          .\tests\Doctor.Tests.ps1
          .\986-Windows-Utility.ps1 -DoctorOnly
      - name: Build release package
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP '986-Windows-Utility-v0.3.0'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'modules') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'docs') | Out-Null
          Copy-Item '986-Windows-Utility.ps1','Start-986-Windows-Utility.cmd','bootstrap.ps1','README.md','LICENSE','CHANGELOG.md' -Destination $stage
          Copy-Item 'modules\TweakIntelligence.ps1','modules\Doctor.ps1' -Destination (Join-Path $stage 'modules')
          Copy-Item 'docs\*.md' -Destination (Join-Path $stage 'docs')
          $zip = Join-Path $env:RUNNER_TEMP '986-Windows-Utility-v0.3.0.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sum = Join-Path $env:RUNNER_TEMP 'SHA256SUMS-v0.3.0.txt'
          [IO.File]::WriteAllText($sum,"$hash  986-Windows-Utility-v0.3.0.zip`n",[Text.UTF8Encoding]::new($false))
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SUM=$sum" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SHA256=$hash"
      - name: Write release notes
        shell: powershell
        run: |
          $notes = @'
          ## 986 Windows Utility v0.3.0 — 986 Doctor

          This release adds the **986 Doctor** diagnostics and explicit-repair layer.

          ### Highlights
          - Windows health dashboard for system, storage, servicing, security and network signals
          - privacy-hardened Doctor JSON reports
          - headless `-DoctorOnly` and optional `-DoctorJson`
          - DISM CheckHealth / ScanHealth / RestoreHealth
          - SFC scan/repair, DNS flush and Winsock reset
          - repair preflight, explicit confirmation and timestamped logs
          - Tweak Intelligence and the 20 state-aware reversible tweaks remain included

          ### Safety
          Doctor refresh/report paths are read-only. System-changing repair actions require explicit user selection and confirmation; no repair runs automatically.
          '@
          $path = Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES_v0.3.0.md'
          [IO.File]::WriteAllText($path,$notes,[Text.UTF8Encoding]::new($false))
          "NOTES=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 --target a6bda068459a5411ff986cbc8e7de52914c50938 --title '986 Windows Utility v0.3.0' --notes-file $env:NOTES $env:ZIP '.\986-Windows-Utility.ps1' $env:SUM
