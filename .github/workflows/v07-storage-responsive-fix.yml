name: v07-storage-responsive-fix
on:
  push:
    branches: [ feature/v0.7-storage-view ]
    paths:
      - .github/workflows/v07-storage-responsive-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-storage-view
          fetch-depth: 0
      - name: Apply responsive Storage patch
        shell: powershell
        run: python .\tools\fix_v07_storage_responsive.py
      - name: Validate native Storage contract
        shell: powershell
        run: .\tests\StorageShell.Tests.ps1
      - name: Build complete Storage payload
        shell: powershell
        run: |
          $out = Join-Path $env:TEMP '986StorageResponsiveBuild'
          $result = .\storage\Build-StorageView.ps1 -OutputDir $out
          if (-not (Test-Path $result.Scanner)) { throw '986StorageScanner.exe missing.' }
          if (-not (Test-Path $result.Shell)) { throw '986StorageShell.dll missing.' }
          Write-Host "Scanner SHA256=$($result.ScannerSha256)"
          Write-Host "Shell SHA256=$($result.ShellSha256)"
      - name: Commit fix and remove transient patch helpers
        shell: powershell
        run: |
          Remove-Item .\tools\fix_v07_storage_responsive.py -Force
          Remove-Item .\.github\workflows\v07-storage-responsive-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix 986 Storage layout for narrow Explorer views"
          git push origin HEAD:feature/v0.7-storage-view
