name: Temporary Storage logo-lock patch v2

on:
  push:
    branches:
      - fix/storage-shell-update-lifecycle
    paths:
      - .github/workflows/patch-storage-logo-lock-temp2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-shell-update-lifecycle
          fetch-depth: 0
      - name: Patch native watermark loader
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('storage/shell/StorageShell.cpp')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    void LoadBrandWatermark\(\) \{.*?\n    \}\n\n    void DrawBrandWatermark', re.S)
          replacement = '''    void LoadBrandWatermark() {
              Gdiplus::GdiplusStartupInput input;
              if (Gdiplus::GdiplusStartup(&gdiplusToken_, &input, nullptr) != Gdiplus::Ok) { gdiplusToken_ = 0; return; }
              const std::wstring candidates[] = {
                  ModuleDirectory() + L"\\\\AbeyyTechXy-logo.png",
                  ModuleDirectory() + L"\\\\..\\\\..\\\\assets\\\\AbeyyTechXy-logo.png"
              };
              for (const auto& path : candidates) {
                  Gdiplus::Image* source = Gdiplus::Image::FromFile(path.c_str(), FALSE);
                  if (!source || source->GetLastStatus() != Gdiplus::Ok) { delete source; continue; }
                  const UINT width = source->GetWidth(), height = source->GetHeight();
                  if (!width || !height) { delete source; continue; }
                  Gdiplus::Bitmap* copy = new (std::nothrow) Gdiplus::Bitmap(width, height, PixelFormat32bppPARGB);
                  if (!copy || copy->GetLastStatus() != Gdiplus::Ok) { delete copy; delete source; continue; }
                  Gdiplus::Graphics graphics(copy);
                  if (graphics.DrawImage(source, 0, 0, width, height) == Gdiplus::Ok) watermark_ = copy;
                  else delete copy;
                  delete source;
                  if (watermark_) break;
              }
          }

          void DrawBrandWatermark'''
          updated, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one LoadBrandWatermark function, found {count}')
          p.write_text(updated, encoding='utf-8', newline='\n')
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'ModuleDirectory() + L"\\AbeyyTechXy-logo.png"' storage/shell/StorageShell.cpp
          grep -F 'Gdiplus::Bitmap* copy' storage/shell/StorageShell.cpp
          grep -F 'delete source;' storage/shell/StorageShell.cpp
          ! grep -F 'watermark_ = Gdiplus::Image::FromFile' storage/shell/StorageShell.cpp
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storage/shell/StorageShell.cpp
          git diff --cached --check
          git commit -m 'fix: release Storage watermark file lock'
          git push origin HEAD:fix/storage-shell-update-lifecycle
