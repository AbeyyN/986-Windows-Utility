name: Temporary Storage logo-lock patch v2

on:
  push:
    branches:
      - fix/storage-shell-update-lifecycle
    paths:
      - .github/workflows/patch-storage-logo-lock-temp2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-shell-update-lifecycle
          fetch-depth: 0
      - name: Apply Storage logo-lock fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('bootstrap.ps1')
          t = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global t
              n = t.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1, found {n}')
              t = t.replace(old, new)

          one("    $parent = Split-Path -Parent $Destination\n",
              """    if (Test-Path -LiteralPath $Destination -PathType Leaf) {
              try {
                  $sourceInfo = Get-Item -LiteralPath $Source
                  $destinationInfo = Get-Item -LiteralPath $Destination
                  if ($sourceInfo.Length -eq $destinationInfo.Length) {
                      $sourceHash = (Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash
                      $destinationHash = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash
                      if ($sourceHash -eq $destinationHash) { return }
                  }
              } catch { }
          }
          $parent = Split-Path -Parent $Destination
          """, 'identical-file guard')

          one("        [Parameter(Mandatory)][string]$SourceStorage,\n        [Parameter(Mandatory)][string]$Root,",
              "        [Parameter(Mandatory)][string]$SourceStorage,\n        [Parameter(Mandatory)][string]$SourceLogo,\n        [Parameter(Mandatory)][string]$Root,",
              'SourceLogo param')

          one("    New-Item -ItemType Directory -Force -Path $storageRoot | Out-Null\n",
              """    if (-not (Test-Path -LiteralPath $SourceLogo -PathType Leaf)) {
              throw 'Release package is missing assets\\AbeyyTechXy-logo.png.'
          }

          New-Item -ItemType Directory -Force -Path $storageRoot | Out-Null
          """, 'SourceLogo validation')

          one("""    $versionedShell = Join-Path $versionedShellDir '986StorageShell.dll'
          New-Item -ItemType Directory -Force -Path $versionedShellDir | Out-Null
          """,
              """    $versionedShell = Join-Path $versionedShellDir '986StorageShell.dll'
          $versionedLogo = Join-Path $versionedShellDir 'AbeyyTechXy-logo.png'
          New-Item -ItemType Directory -Force -Path $versionedShellDir | Out-Null

          if (Test-Path -LiteralPath $versionedLogo -PathType Leaf) {
              $sourceLogoHash = (Get-FileHash -LiteralPath $SourceLogo -Algorithm SHA256).Hash
              $targetLogoHash = (Get-FileHash -LiteralPath $versionedLogo -Algorithm SHA256).Hash
              if ($sourceLogoHash -ne $targetLogoHash) {
                  throw "Existing versioned Storage logo does not match $ReleaseTag. Refusing to mutate an immutable version payload."
              }
          } else {
              Copy-Item -LiteralPath $SourceLogo -Destination $versionedLogo -Force
          }
          """, 'versioned logo')

          one("        'storage\\bin\\986StorageScanner.exe'\n",
              "        'storage\\bin\\986StorageScanner.exe',\n        'assets\\AbeyyTechXy-logo.png'\n",
              'required logo')

          one("[void](Install-986StoragePayload -SourceStorage $item.FullName -Root $InstallDir -ReleaseTag ([string]$release.tag_name) -RepairMode $repairMode)",
              "[void](Install-986StoragePayload -SourceStorage $item.FullName -SourceLogo (Join-Path $packageRoot.FullName 'assets\\AbeyyTechXy-logo.png') -Root $InstallDir -ReleaseTag ([string]$release.tag_name) -RepairMode $repairMode)",
              'storage install call')

          one("""        $destination = Join-Path $InstallDir $item.Name
                  if ($repairMode) {
          """,
              """        $destination = Join-Path $InstallDir $item.Name
                  if ($repairMode -or ($item.Name -eq 'assets' -and $item.PSIsContainer)) {
          """, 'asset merge mode')
          p.write_text(t, encoding='utf-8', newline='\n')

          p = Path('storage/shell/StorageShell.cpp')
          t = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    void LoadBrandWatermark\(\) \{.*?\n    \}\n\n    void DrawBrandWatermark', re.S)
          replacement = '''    void LoadBrandWatermark() {
              Gdiplus::GdiplusStartupInput input;
              if (Gdiplus::GdiplusStartup(&gdiplusToken_, &input, nullptr) != Gdiplus::Ok) { gdiplusToken_ = 0; return; }
              const std::wstring candidates[] = {
                  ModuleDirectory() + L"\\\\AbeyyTechXy-logo.png",
                  ModuleDirectory() + L"\\\\..\\\\..\\\\assets\\\\AbeyyTechXy-logo.png"
              };
              for (const auto& path : candidates) {
                  Gdiplus::Image* source = Gdiplus::Image::FromFile(path.c_str(), FALSE);
                  if (!source || source->GetLastStatus() != Gdiplus::Ok) { delete source; continue; }
                  const UINT width = source->GetWidth(), height = source->GetHeight();
                  if (!width || !height) { delete source; continue; }
                  Gdiplus::Bitmap* copy = new (std::nothrow) Gdiplus::Bitmap(width, height, PixelFormat32bppPARGB);
                  if (!copy || copy->GetLastStatus() != Gdiplus::Ok) { delete copy; delete source; continue; }
                  Gdiplus::Graphics graphics(copy);
                  if (graphics.DrawImage(source, 0, 0, width, height) == Gdiplus::Ok) watermark_ = copy;
                  else delete copy;
                  delete source;
                  if (watermark_) break;
              }
          }

          void DrawBrandWatermark'''
          t, n = pattern.subn(replacement, t, count=1)
          if n != 1: raise SystemExit(f'watermark function: expected 1, found {n}')
          p.write_text(t, encoding='utf-8', newline='\n')

          p = Path('tests/Bootstrap.Tests.ps1')
          t = p.read_text(encoding='utf-8')
          old = "foreach ($marker in 'Get-986InstalledVersion','Copy-986MergeItem','Install-986StoragePayload','repairMode','Refusing to overwrite a possibly loaded DLL','Explorer restart is not forced')"
          new = "foreach ($marker in 'Get-986InstalledVersion','Copy-986MergeItem','Install-986StoragePayload','repairMode','Refusing to overwrite a possibly loaded DLL','Explorer restart is not forced','SourceLogo','versionedLogo','AbeyyTechXy-logo.png')"
          if t.count(old) != 1: raise SystemExit('Bootstrap.Tests marker mismatch')
          t = t.replace(old, new)
          anchor = "if ($bootstrapText -notmatch [regex]::Escape('$installedVersion -eq $releaseVersion')) {"
          extra = """if ($bootstrapText -notmatch [regex]::Escape('Get-FileHash -LiteralPath $Destination -Algorithm SHA256')) {
              throw 'Bootstrap identical-file repair guard is missing.'
          }
          if ($bootstrapText -notmatch [regex]::Escape("$item.Name -eq 'assets'")) {
              throw 'Bootstrap must merge shared assets so an identical locked legacy logo is not replaced.'
          }

          """
          if t.count(anchor) != 1: raise SystemExit('Bootstrap.Tests insertion mismatch')
          t = t.replace(anchor, extra + anchor)
          p.write_text(t, encoding='utf-8', newline='\n')

          p = Path('tests/StorageShell.Tests.ps1')
          t = p.read_text(encoding='utf-8')
          old = "foreach ($marker in '#include <gdiplus.h>','LoadBrandWatermark','DrawBrandWatermark','AbeyyTechXy-logo.png','0.25f','DrawBrandWatermark(dc, client)') {"
          new = "foreach ($marker in '#include <gdiplus.h>','LoadBrandWatermark','DrawBrandWatermark','AbeyyTechXy-logo.png','ModuleDirectory() + L\"\\\\AbeyyTechXy-logo.png\"','Gdiplus::Bitmap* copy','delete source','0.25f','DrawBrandWatermark(dc, client)') {"
          if t.count(old) != 1: raise SystemExit('StorageShell.Tests marker mismatch')
          t = t.replace(old, new)
          anchor = "$buildText = Get-Content (Join-Path $root 'storage\\Build-StorageView.ps1') -Raw -Encoding UTF8\n"
          insert = "if ($cppText -match 'watermark_\\s*=\\s*Gdiplus::Image::FromFile') { throw '986 Storage must not retain a file-backed GDI+ watermark that locks the shared logo.' }\n"
          if t.count(anchor) != 1: raise SystemExit('StorageShell.Tests insertion mismatch')
          t = t.replace(anchor, insert + anchor)
          p.write_text(t, encoding='utf-8', newline='\n')
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "Get-FileHash -LiteralPath \$Destination -Algorithm SHA256" bootstrap.ps1
          grep -F 'versionedLogo' bootstrap.ps1
          grep -F 'ModuleDirectory() + L"\\AbeyyTechXy-logo.png"' storage/shell/StorageShell.cpp
          grep -F 'Gdiplus::Bitmap* copy' storage/shell/StorageShell.cpp
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap.ps1 storage/shell/StorageShell.cpp tests/Bootstrap.Tests.ps1 tests/StorageShell.Tests.ps1
          git diff --cached --check
          git commit -m 'fix: release Storage logo locks during update'
          git push origin HEAD:fix/storage-shell-update-lifecycle
