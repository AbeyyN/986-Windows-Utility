name: release-v07-rc
on:
  push:
    branches: [ feature/v0.7-storage-view ]
    paths: [ .github/RELEASE_V07_RC ]
permissions:
  contents: write
jobs:
  package-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release request
        shell: powershell
        run: |
          if ((Get-Content .github\RELEASE_V07_RC -Raw).Trim() -ne 'v0.7.0-rc.1') { throw 'Unexpected RC release request.' }
          if ((Get-Content .\986-Windows-Utility.ps1 -Raw) -notmatch "\$Version = '0\.7\.0-rc\.1'") { throw 'App version is not v0.7.0-rc.1.' }
      - name: Run full validation suite
        shell: powershell
        run: |
          $tests = @('Encoding.Tests.ps1','Static.Tests.ps1','Audit.Tests.ps1','Doctor.Tests.ps1','Profile.Tests.ps1','NoLock.Tests.ps1','Wave2.Tests.ps1','PreferenceOverride.Tests.ps1','SingleSelection.Tests.ps1','Resolution.Tests.ps1','StorageScanner.Tests.ps1','StorageRegistration.Tests.ps1','StorageShell.Tests.ps1','Gui.Tests.ps1')
          foreach ($t in $tests) { & (Join-Path .\tests $t); if (-not $?) { throw "Test failed: $t" } }
          .\986-Windows-Utility.ps1 -AuditOnly | Out-Null
          .\986-Windows-Utility.ps1 -DoctorOnly | Out-Null
          .\986-Windows-Utility.ps1 -ProfileList | Out-Null
      - name: Build complete RC package
        shell: powershell
        run: |
          $version = 'v0.7.0-rc.1'
          $pkgName = "986-Windows-Utility-$version"
          $stageRoot = Join-Path $env:RUNNER_TEMP '986-rc-stage'
          $pkg = Join-Path $stageRoot $pkgName
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pkg 'modules') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pkg 'display') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pkg 'storage\registration') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pkg 'storage\bin') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pkg 'docs') -Force | Out-Null
          Copy-Item .\986-Windows-Utility.ps1,.\Start-986-Windows-Utility.cmd,.\README.md,.\LICENSE,.\CHANGELOG.md -Destination $pkg
          Copy-Item .\modules\*.ps1 -Destination (Join-Path $pkg 'modules')
          Copy-Item .\display\ResolutionManager.ps1,.\display\ResolutionUi.ps1 -Destination (Join-Path $pkg 'display')
          Copy-Item .\storage\registration\Register-StorageView.ps1 -Destination (Join-Path $pkg 'storage\registration')
          Copy-Item .\docs\NO-LOCK.md,.\docs\TWEAKS.md,.\docs\STORAGE-VIEW.md,.\docs\CUSTOM-RESOLUTION.md -Destination (Join-Path $pkg 'docs')
          $displayBuild = & .\display\Build-ResolutionHelper.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP '986-display-build')
          Copy-Item $displayBuild.Helper -Destination (Join-Path $pkg 'display\986ResolutionHelper.exe')
          $storageBuild = & .\storage\Build-StorageView.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP '986-storage-build')
          Copy-Item $storageBuild.Shell -Destination (Join-Path $pkg 'storage\bin\986StorageShell.dll')
          Copy-Item $storageBuild.Scanner -Destination (Join-Path $pkg 'storage\bin\986StorageScanner.exe')
          $zip = Join-Path $PWD "$pkgName.zip"
          Compress-Archive -Path $pkg -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $pkgName.zip" | Set-Content -Path "SHA256SUMS-$version.txt" -Encoding ascii
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHA=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RC_ZIP_SHA256=$hash"
      - name: Publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          986 Windows Utility v0.7.0-rc.1

          Release candidate for 986 Storage View and 986 Custom Resolution.

          Highlights:
          - Android-style segmented storage cards inside an optional This PC namespace view.
          - Out-of-process read-only scanner for Apps, Videos, Pictures, Documents, Audio, System and Other.
          - Per-user reversible Explorer registration with foreign-collision protection.
          - Arbitrary width/height/refresh driver trials using CDS_TEST.
          - 15-second Keep/Revert confirmation with one-shot crash fallback and exact original-mode Undo.
          - Existing 30 active Windows tweaks + 4 legacy Undo-only entries remain unchanged.
          - Never-Lock rule remains permanent: no watchdog, policy enforcement or automatic re-apply.

          RC limitation:
          Real-machine Explorer and physical display smoke tests are still pending because the authorized Commander Windows targets were offline at RC publication. This is a prerelease, not the stable v0.7.0 promotion.
          '@ | Set-Content RELEASE_NOTES_RC.md -Encoding ascii
          gh release create v0.7.0-rc.1 "$env:ZIP" "SHA256SUMS-v0.7.0-rc.1.txt" --prerelease --title "986 Windows Utility v0.7.0-rc.1" --notes-file RELEASE_NOTES_RC.md --target "$env:GITHUB_SHA"
