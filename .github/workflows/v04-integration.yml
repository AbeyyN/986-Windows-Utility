name: v0.4 Profile Integration
# rerun after profile-test regex fix

on:
  push:
    branches: [ feature/v0.4-profiles ]
    paths: [ '.github/workflows/v04-integration.yml' ]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.4-profiles
          fetch-depth: 0
      - name: Apply deterministic profile integration
        run: python ./tools/apply_v040.py
      - name: Parse and static validation
        shell: pwsh
        run: ./tests/Static.Tests.ps1
      - name: Profile engine safety validation
        shell: pwsh
        run: ./tests/Profile.Tests.ps1
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 986-Windows-Utility.ps1 bootstrap.ps1 README.md ROADMAP.md tests/Static.Tests.ps1
          git add -u tools/apply_v040.py
          if git diff --cached --quiet; then echo 'No integration changes to commit.'; exit 0; fi
          git commit -m "Integrate 986 Profiles v0.4.0-alpha.1"
          git push origin HEAD:feature/v0.4-profiles
