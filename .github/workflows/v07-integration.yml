name: v07-integration
on:
  push:
    branches: [ feature/v0.7-storage-view ]
    paths: [ tools/apply_v070.py ]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-storage-view
      - name: Apply deterministic v0.7 integration
        shell: powershell
        run: python tools/apply_v070.py
      - name: Validate integrated source
        shell: powershell
        run: |
          .\tests\Encoding.Tests.ps1
          .\tests\Static.Tests.ps1
          .\tests\Gui.Tests.ps1
          .\tests\Resolution.Tests.ps1
          .\tests\StorageScanner.Tests.ps1
          .\tests\StorageRegistration.Tests.ps1
          .\tests\StorageShell.Tests.ps1
      - name: Commit integrated source and remove helper
        shell: powershell
        run: |
          Remove-Item tools\apply_v070.py -Force
          Remove-Item .github\workflows\v07-integration.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate v0.7 Storage View and Custom Resolution UI"
          git push origin HEAD:feature/v0.7-storage-view
