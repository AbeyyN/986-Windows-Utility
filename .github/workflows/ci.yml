name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate UTF-8 and mojibake
        shell: powershell
        run: .\tests\Encoding.Tests.ps1
      - name: Run static tests
        shell: powershell
        run: .\tests\Static.Tests.ps1
      - name: Validate read-only audit module
        shell: powershell
        run: .\tests\Audit.Tests.ps1
      - name: Validate Doctor safety model
        shell: powershell
        run: .\tests\Doctor.Tests.ps1
      - name: Validate Profiles safety model
        shell: powershell
        run: .\tests\Profile.Tests.ps1
      - name: Enforce Never-Lock tweak baseline
        shell: powershell
        run: .\tests\NoLock.Tests.ps1
      - name: Validate Wave 2 tweak definitions
        shell: powershell
        run: .\tests\Wave2.Tests.ps1
      - name: Prove manual preference override persists
        shell: powershell
        run: .\tests\PreferenceOverride.Tests.ps1
      - name: Validate single-tweak selection
        shell: powershell
        run: .\tests\SingleSelection.Tests.ps1
      - name: Validate custom resolution safety layer
        shell: powershell
        run: .\tests\Resolution.Tests.ps1
      - name: Compile and test storage scanner
        shell: powershell
        run: .\tests\StorageScanner.Tests.ps1
      - name: Validate storage registration contract
        shell: powershell
        run: .\tests\StorageRegistration.Tests.ps1
      - name: Validate native storage shell contract
        shell: powershell
        run: .\tests\StorageShell.Tests.ps1
      - name: Compile native 986 Storage shell DLL
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ toolchain not found.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $out = Join-Path $env:TEMP '986StorageShell.dll'
          $cmd = '"' + $vcvars + '" && cl /nologo /std:c++17 /EHsc /LD storage\shell\StorageShell.cpp /link /DEF:storage\shell\StorageShell.def ole32.lib shell32.lib user32.lib uuid.lib /OUT:"' + $out + '"'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $out)) { throw '986StorageShell.dll was not produced.' }
      - name: WPF profile UI smoke test
        shell: powershell
        run: .\tests\Gui.Tests.ps1
      - name: Headless audit smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -AuditOnly
      - name: Headless Doctor smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -DoctorOnly
      - name: Headless profile-list smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -ProfileList
