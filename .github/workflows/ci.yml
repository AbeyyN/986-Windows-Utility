name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate UTF-8 and mojibake
        shell: powershell
        run: .\tests\Encoding.Tests.ps1
      - name: Run static tests
        shell: powershell
        run: .\tests\Static.Tests.ps1
      - name: Validate read-only audit module
        shell: powershell
        run: .\tests\Audit.Tests.ps1
      - name: Headless audit smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -AuditOnly
