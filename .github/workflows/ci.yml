name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate UTF-8 and mojibake
        shell: powershell
        run: .\tests\Encoding.Tests.ps1
      - name: Run static tests
        shell: powershell
        run: .\tests\Static.Tests.ps1
      - name: Validate read-only audit module
        shell: powershell
        run: .\tests\Audit.Tests.ps1
      - name: Validate Doctor safety model
        shell: powershell
        run: .\tests\Doctor.Tests.ps1
      - name: Validate Profiles safety model
        shell: powershell
        run: .\tests\Profile.Tests.ps1
      - name: Enforce Never-Lock tweak baseline
        shell: powershell
        run: .\tests\NoLock.Tests.ps1
      - name: Validate Wave 2 tweak definitions
        shell: powershell
        run: .\tests\Wave2.Tests.ps1
      - name: Prove manual preference override persists
        shell: powershell
        run: .\tests\PreferenceOverride.Tests.ps1
      - name: Validate single-tweak selection
        shell: powershell
        run: .\tests\SingleSelection.Tests.ps1
      - name: Validate custom resolution safety layer
        shell: powershell
        run: .\tests\Resolution.Tests.ps1
      - name: Compile and test storage scanner
        shell: powershell
        run: .\tests\StorageScanner.Tests.ps1
      - name: Validate storage registration contract
        shell: powershell
        run: .\tests\StorageRegistration.Tests.ps1
      - name: Validate native storage shell contract
        shell: powershell
        run: .\tests\StorageShell.Tests.ps1
      - name: Build complete 986 Storage payload
        shell: powershell
        run: |
          $out = Join-Path $env:TEMP '986StorageBuild'
          $result = .\storage\Build-StorageView.ps1 -OutputDir $out
          if (-not (Test-Path $result.Scanner)) { throw '986StorageScanner.exe missing.' }
          if (-not (Test-Path $result.Shell)) { throw '986StorageShell.dll missing.' }
          Write-Host "Scanner SHA256=$($result.ScannerSha256)"
          Write-Host "Shell SHA256=$($result.ShellSha256)"
      - name: WPF profile UI smoke test
        shell: powershell
        run: .\tests\Gui.Tests.ps1
      - name: Headless audit smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -AuditOnly
      - name: Headless Doctor smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -DoctorOnly
      - name: Headless profile-list smoke test
        shell: powershell
        run: .\986-Windows-Utility.ps1 -ProfileList
