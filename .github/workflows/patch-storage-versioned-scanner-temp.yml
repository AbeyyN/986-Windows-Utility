name: Temporary Storage versioned scanner hardening

on:
  push:
    branches:
      - fix/storage-shell-update-lifecycle
    paths:
      - .github/workflows/patch-storage-versioned-scanner-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-shell-update-lifecycle
          fetch-depth: 0
      - name: Harden side-by-side Storage payload transaction
        shell: python
        run: |
          from pathlib import Path

          p = Path('bootstrap.ps1')
          text = p.read_text(encoding='utf-8')

          def repl(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          repl("    $sourceShell = Join-Path $sourceBin '986StorageShell.dll'\n",
               "    $sourceShell = Join-Path $sourceBin '986StorageShell.dll'\n    $sourceScanner = Join-Path $sourceBin '986StorageScanner.exe'\n",
               'source scanner path')
          repl("    if (-not (Test-Path -LiteralPath $SourceLogo -PathType Leaf)) {\n",
               "    if (-not (Test-Path -LiteralPath $sourceScanner -PathType Leaf)) {\n        throw 'Release package is missing storage\\bin\\986StorageScanner.exe.'\n    }\n    if (-not (Test-Path -LiteralPath $SourceLogo -PathType Leaf)) {\n",
               'source scanner validation')
          repl("                if ($binItem.Name -eq '986StorageShell.dll') { continue }\n",
               "                if ($binItem.Name -in @('986StorageShell.dll','986StorageScanner.exe')) { continue }\n",
               'skip mutable native bin payloads')
          repl("    $versionedShell = Join-Path $versionedShellDir '986StorageShell.dll'\n",
               "    $versionedShell = Join-Path $versionedShellDir '986StorageShell.dll'\n    $versionedScanner = Join-Path $versionedShellDir '986StorageScanner.exe'\n",
               'versioned scanner path')

          scanner_block = '''
              if (Test-Path -LiteralPath $versionedScanner -PathType Leaf) {
                  $sourceScannerHash = (Get-FileHash -LiteralPath $sourceScanner -Algorithm SHA256).Hash
                  $targetScannerHash = (Get-FileHash -LiteralPath $versionedScanner -Algorithm SHA256).Hash
                  if ($sourceScannerHash -ne $targetScannerHash) {
                      throw "Existing versioned Storage scanner does not match $ReleaseTag. Refusing to mutate an immutable native payload."
                  }
              } else {
                  Copy-Item -LiteralPath $sourceScanner -Destination $versionedScanner -Force
              }
          '''
          marker = "\n    # Legacy fallback is created only once. Never replace it in-place because Explorer\n"
          repl(marker, scanner_block + marker, 'insert immutable versioned scanner')

          legacy_scanner = '''
              # Legacy scanner is created only once. Never replace a possibly running executable
              # in-place; the new versioned shell launches its version-local scanner.
              $legacyScanner = Join-Path $storageRoot 'bin\\986StorageScanner.exe'
              if (-not (Test-Path -LiteralPath $legacyScanner -PathType Leaf)) {
                  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $legacyScanner) | Out-Null
                  Copy-Item -LiteralPath $sourceScanner -Destination $legacyScanner -Force
              }
          '''
          marker2 = "\n    # Migrate an existing 986-owned registration to the immutable versioned path.\n"
          repl(marker2, legacy_scanner + marker2, 'insert legacy scanner fallback')

          start_marker = "    # Migrate an existing 986-owned registration to the immutable versioned path.\n"
          end_marker = "    return $versionedShell\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('defer registration block: markers not found')
          text = text[:start] + end_marker + text[end + len(end_marker):]

          repl("    $stateDir = Join-Path $InstallDir 'state'\n    New-Item -ItemType Directory -Force -Path $stateDir | Out-Null\n\n",
               "    $stateDir = Join-Path $InstallDir 'state'\n    New-Item -ItemType Directory -Force -Path $stateDir | Out-Null\n    $pendingStorageShell = $null\n\n",
               'pending storage shell state')
          repl("            [void](Install-986StoragePayload -SourceStorage $item.FullName -SourceLogo (Join-Path $packageRoot.FullName 'assets\\AbeyyTechXy-logo.png') -Root $InstallDir -ReleaseTag ([string]$release.tag_name) -RepairMode $repairMode)\n",
               "            $pendingStorageShell = Install-986StoragePayload -SourceStorage $item.FullName -SourceLogo (Join-Path $packageRoot.FullName 'assets\\AbeyyTechXy-logo.png') -Root $InstallDir -ReleaseTag ([string]$release.tag_name) -RepairMode $repairMode\n",
               'capture versioned shell')

          deferred = '''    # Switch Explorer registration only after every package copy succeeded. This avoids
              # exposing a new native shell path when a later top-level update step fails.
              if (-not [string]::IsNullOrWhiteSpace([string]$pendingStorageShell)) {
                  $classRoot = 'HKCU:\\Software\\Classes\\CLSID\\{5FCCE720-D806-4B6A-A5F1-F060344FC88D}'
                  if (Test-Path $classRoot) {
                      $owned = $false
                      try {
                          $owned = ((Get-ItemProperty -Path $classRoot -Name '986Owner' -ErrorAction Stop).'986Owner' -eq 'AbeyyTechXy/986-Windows-Utility')
                      } catch { }
                      if ($owned) {
                          $inproc = Join-Path $classRoot 'InprocServer32'
                          if (Test-Path $inproc) {
                              Set-Item -Path $inproc -Value ([IO.Path]::GetFullPath($pendingStorageShell))
                              Write-Host '986 Storage registration switched after the update transaction completed. Explorer restart is not forced.' -ForegroundColor DarkGray
                          }
                      }
                  }
              }

          '''
          repl("    $app = Join-Path $InstallDir '986-Windows-Utility.ps1'\n",
               deferred + "    $app = Join-Path $InstallDir '986-Windows-Utility.ps1'\n",
               'deferred registration switch')

          p.write_text(text, encoding='utf-8', newline='\n')

          t = Path('tests/Bootstrap.Tests.ps1')
          tt = t.read_text(encoding='utf-8')
          old = "foreach ($marker in 'Get-986InstalledVersion','Copy-986MergeItem','Install-986StoragePayload','versionedShellDir','versionedLogo','SourceLogo','AbeyyTechXy-logo.png','repairMode','Refusing to overwrite a possibly loaded DLL','Explorer restart is not forced') {\n"
          new = "foreach ($marker in 'Get-986InstalledVersion','Copy-986MergeItem','Install-986StoragePayload','versionedShellDir','versionedScanner','versionedLogo','SourceLogo','986StorageScanner.exe','AbeyyTechXy-logo.png','repairMode','Refusing to overwrite a possibly loaded DLL','Refusing to mutate an immutable native payload','pendingStorageShell','update transaction completed','Explorer restart is not forced') {\n"
          if tt.count(old) != 1:
              raise SystemExit('bootstrap marker list drifted')
          tt = tt.replace(old, new, 1)

          anchor = "if ($bootstrapText -notmatch [regex]::Escape('$installedVersion -eq $releaseVersion')) {\n    throw 'Bootstrap same-version repair guard is missing.'\n}\n"
          extra = anchor + "if ($bootstrapText -notmatch [regex]::Escape(\"$binItem.Name -in @('986StorageShell.dll','986StorageScanner.exe')\")) {\n    throw 'Bootstrap must not replace either native Storage binary in legacy bin during update.'\n}\n$copyLoop = $bootstrapText.IndexOf('foreach ($item in @(Get-ChildItem -Path $packageRoot.FullName -Force))')\n$registrySwitch = $bootstrapText.IndexOf('Switch Explorer registration only after every package copy succeeded')\nif ($copyLoop -lt 0 -or $registrySwitch -lt 0 -or $registrySwitch -le $copyLoop) {\n    throw 'Storage registration must switch only after the package copy transaction completes.'\n}\n"
          if tt.count(anchor) != 1:
              raise SystemExit('bootstrap repair anchor drifted')
          tt = tt.replace(anchor, extra, 1)
          tt = tt.replace("Write-Host 'PASS: bootstrap and Update Center use non-destructive, version-aware Storage shell update lifecycle.' -ForegroundColor Green",
                          "Write-Host 'PASS: bootstrap and Update Center use transactional, non-destructive, version-aware Storage native payload lifecycle.' -ForegroundColor Green")
          t.write_text(tt, encoding='utf-8', newline='\n')
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'versionedScanner' bootstrap.ps1
          grep -F 'pendingStorageShell' bootstrap.ps1
          grep -F "986StorageShell.dll','986StorageScanner.exe" bootstrap.ps1
          grep -F 'transactional, non-destructive' tests/Bootstrap.Tests.ps1
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap.ps1 tests/Bootstrap.Tests.ps1
          git diff --cached --check
          git commit -m 'fix: version Storage scanner and defer registration switch'
          git push origin HEAD:fix/storage-shell-update-lifecycle
