name: v0.3 Integration Bootstrap

on:
  push:
    branches: [ feature/v0.3-doctor ]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v03-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3-doctor
          fetch-depth: 0
      - name: Apply deterministic v0.3 integration
        run: python ./tools/run_v030.py
      - name: Validate app and modules parse
        shell: pwsh
        run: ./tests/Static.Tests.ps1
      - name: Validate Tweak Intelligence safety
        shell: pwsh
        run: ./tests/Audit.Tests.ps1
      - name: Validate Doctor safety
        shell: pwsh
        run: ./tests/Doctor.Tests.ps1
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo 'No integration changes to commit.'; exit 0; fi
          git commit -m "Integrate 986 Doctor v0.3.0 [v03-integrated]"
          git push origin HEAD:feature/v0.3-doctor
